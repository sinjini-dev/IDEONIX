{% extends "base.html" %}
{% block title %}Post Task – IDEONIX{% endblock %}
{% block extra_style %}
.form-wrap{max-width:580px;margin:2rem auto;padding:0 1.5rem}
{% endblock %}
{% block content %}
<div class="form-wrap">
  <div class="page-header">
    <h1>Post a New Task</h1>
    <p>Describe the community need and required volunteers</p>
  </div>
  <div class="card">
    <form method="POST">
      <div class="form-group">
        <label>Task Title *</label>
        <input type="text" name="title" placeholder="e.g. Food distribution in rural area" required/>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea name="description" placeholder="Describe the task, how many volunteers needed, what they'll do…"></textarea>
      </div>
      <div class="form-group">
        <label>Location / Area</label>
        <input type="text" name="location" placeholder="e.g. Dharavi, Mumbai"/>
      </div>
      <div class="form-group">
        <label>Required Skills <span style="color:var(--muted)">(comma-separated)</span></label>
        <input type="text" name="required_skills" placeholder="e.g. medical, teaching, social work, driving"/>
      </div>
      <div class="form-group">
        <label>Urgency Level</label>
        <select name="urgency">
          <option value="high">🔴 High – Urgent</option>
          <option value="medium" selected>🟡 Medium</option>
          <option value="low">🟢 Low</option>
        </select>
      </div>
      <div style="display:flex;gap:1rem">
        <button type="submit" class="btn btn-primary" style="flex:1;justify-content:center">Post Task</button>
        <a href="/dashboard" class="btn btn-outline" style="flex:1;justify-content:center">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
